[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "appfinanzas-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "email-validator>=2.1",
  "fastapi>=0.115",
  "passlib>=1.7",
  "psycopg>=3.2",
  "pydantic-settings>=2.4",
  "pyjwt>=2.8",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "flake8>=7.1",
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
